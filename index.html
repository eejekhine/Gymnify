<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gymnify</title>
<meta name="apple-mobile-web-app-title" content="Gymnify">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0d0f1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#0d0f1a;--surface:#151829;--surface2:#1d2138;--border:#2a2f4b;--text:#eef0fb;--dim:#a4aac8;--faint:#737aa5;--accent:#8f84ff;--accent-ink:#0d0f1a;--accent2:#5fd0ff;--good:#5be3a1;--warn:#ffcc66;--crit:#ff8a9a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'Figtree',system-ui,-apple-system,sans-serif;padding:0 0 calc(86px + env(safe-area-inset-bottom,0px));min-height:100vh}
.hub-bar{margin:0}
#app{max-width:760px;margin:0 auto;padding:0 14px}
h1,h2,h3{font-family:'Space Grotesk','Figtree',system-ui,sans-serif;margin:0;line-height:1.15}
h1{font-size:28px}h2{font-size:20px}h3{font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.dim{color:var(--dim)}.faint{color:var(--faint)}.sm{font-size:13px}.xs{font-size:11.5px}
.lab{font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.top{display:flex;align-items:center;gap:10px;padding:16px 0 8px}
.top .grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin:10px 0}
.card.hl{border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.sp{flex:1}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.crit{background:transparent;border:1px solid var(--crit);color:var(--crit)}
.btn.good{background:var(--good);color:#06150e}
.btn[disabled]{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--surface2);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--dim)}
.chip.on{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:3px}
.seg button{background:transparent;border:0;border-radius:8px;padding:7px 18px;font-weight:700;color:var(--faint)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg.home button.on{background:var(--accent2);color:#04141c}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:140px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.gnav{position:fixed;left:0;right:0;bottom:0;z-index:200;display:flex;justify-content:center;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--border)}
.gnav button{flex:1;max-width:130px;background:transparent;border:0;border-radius:10px;padding:7px 2px;font-size:11px;font-weight:700;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:2px}
.gnav button svg{width:22px;height:22px}
.gnav button.on{color:var(--text);background:var(--surface2)}
.gnav button.on svg{color:var(--accent)}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--border)}
.list li:first-child{border-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:700 22px 'Space Grotesk',sans-serif}
.ex{border:1px solid var(--border);background:var(--surface);border-radius:14px;margin:10px 0;overflow:hidden}
.ex-h{display:flex;gap:8px;align-items:flex-start;padding:12px 12px 6px}
.ex-h .nm{flex:1;min-width:0}
.ex-h .nm b{font-size:16px}
.ex-h .menu{background:transparent;border:0;color:var(--faint);font-size:20px;line-height:1;padding:4px 8px}
.swapnote{font-size:12px;color:var(--accent2);margin-top:2px}
.hint{display:inline-flex;gap:6px;align-items:center;margin:2px 12px 8px;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good);font-size:12px;border:0}
table.sets{width:100%;border-collapse:collapse}
table.sets th{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:2px 4px;text-align:center}
table.sets td{padding:3px 4px;text-align:center;vertical-align:middle}
table.sets td.n{width:34px}
table.sets td.prev{color:var(--faint);font-size:12px;width:84px;white-space:nowrap}
table.sets input{text-align:center;padding:8px 2px;font-weight:700;font-size:16px}
table.sets tr.done input{background:color-mix(in srgb,var(--good) 14%,var(--bg));border-color:transparent}
.setn{width:30px;height:30px;border-radius:8px;border:0;background:var(--surface2);font:700 13px 'JetBrains Mono',monospace;color:var(--dim)}
.setn.w{background:color-mix(in srgb,var(--warn) 22%,var(--surface));color:var(--warn)}
.tick{width:38px;height:38px;border-radius:10px;border:2px solid var(--border);background:transparent;display:grid;place-items:center;color:transparent}
.tick.on{background:var(--good);border-color:var(--good);color:#06150e}
.exf{display:flex;gap:8px;padding:8px 12px 12px;flex-wrap:wrap}
.pr{color:var(--warn);font-size:14px}
.rest{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:250;max-width:740px;margin:0 auto;background:var(--surface2);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.rest .t{font:700 26px 'Space Grotesk',sans-serif;min-width:70px}
.rest .bar{flex:1;height:6px;border-radius:99px;background:var(--bg);overflow:hidden}
.rest .bar i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.rest.over{border-color:var(--good)}
.sheet-bg{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:88vh;overflow:auto;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:500;background:var(--surface2);border:1px solid var(--border);padding:9px 16px;border-radius:99px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:90vw}
.charts svg{width:100%;height:auto;display:block}
svg text{fill:var(--faint);font:10px 'JetBrains Mono',monospace}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.heat div.col{display:grid;gap:4px}
.heat i{display:block;aspect-ratio:1;border-radius:4px;background:var(--surface2)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 45%,var(--surface2))}
.heat i.l2{background:var(--accent)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos .ph{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:2px solid transparent;background:var(--surface2)}
.photos .ph.sel{border-color:var(--accent)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph span{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;background:rgba(0,0,0,.6);font-size:11px}
.kit{display:flex;flex-wrap:wrap;gap:6px}
.sub-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.sub-tabs button{white-space:nowrap}
.empty{color:var(--dim);padding:14px 0;text-align:center}
.badge{font:600 10px 'JetBrains Mono',monospace;border-radius:6px;padding:2px 6px;background:var(--surface2);color:var(--dim)}
.badge.home{background:color-mix(in srgb,var(--accent2) 22%,var(--surface));color:var(--accent2)}
.sync{font:500 11px 'JetBrains Mono',monospace;color:var(--faint)}
.sync b{color:var(--good);font-weight:500}
.sync b.off{color:var(--warn)}
@media (max-width:420px){table.sets td.prev{width:64px;font-size:11px}.btn{padding:10px 13px}}

body:has(.rest){padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}

</style>
</head>

/* ---------- gym / home swap ---------- */
function kit(mode){return mode==='home'?S.settings.kitHome:S.settings.kitGym}
function canDo(id,mode){var e=EX[id];if(!e)return true;var k=kit(mode);return e.eq.every(function(q){return k[q]})}
function resolve(id,mode,seen){
  seen=seen||{};if(seen[id])return null;seen[id]=1;
  var e=EX[id];if(!e)return id;
  if(canDo(id,mode))return id;
  for(var i=0;i<e.alts.length;i++){var r=resolve(e.alts[i],mode,seen);if(r)return r}
  return null;
}
function options(id,mode){
  /* every exercise reachable through the swap chain that works in this mode, plus same-muscle exercises */
  var out=[],seen={};
  function walk(x){var e=EX[x];if(!e||seen[x])return;seen[x]=1;if(x!==id&&canDo(x,mode))out.push(x);e.alts.forEach(walk)}
  walk(id);
  var m=EX[id]&&EX[id].muscle;
  EXLIST.forEach(function(e){if(e.id!==id&&e.muscle===m&&canDo(e.id,mode)&&out.indexOf(e.id)<0)out.push(e.id)});
  return out;
}
function exName(id){return EX[id]?EX[id].name:id}

/* ---------- performance maths ---------- */

function prevEntry(exId,beforeStart){
  var l=sessionsDesc();
  for(var i=0;i<l.length;i++){
    if(beforeStart&&l[i].start>=beforeStart)continue;
    for(var j=0;j<l[i].entries.length;j++){var e=l[i].entries[j];if(e.ex===exId&&working(e).length)return {entry:e,date:l[i].date}}
  }

}
function bestOf(exId,excludeSetRef){
  var t=EX[exId]?EX[exId].type:'w',best=0,bestW=0;
  S.sessions.forEach(function(se){se.entries.forEach(function(e){if(e.ex!==exId)return;working(e).forEach(function(s){
    var v=t==='w'||num(s.w)>0?e1rm(s.w,s.r):num(s.r);if(t==='t')v=num(s.r);if(v>best)best=v;if(num(s.w)>bestW)bestW=num(s.w)})})});

}

function hintFor(entry){
  var e=EX[entry.ex];if(!e||e.type==='t')return null;
  var pv=prevEntry(entry.ex,S.active&&S.active.start);if(!pv)return null;
  var ws=working(pv.entry);if(!ws.length)return null;
  var top=topRep(entry.reps)||0,low=lowRep(entry.reps)||0;
  var w=Math.max.apply(null,ws.map(function(s){return num(s.w)}));
  var allHit=top&&ws.every(function(s){return num(s.r)>=top});
  if(e.type==='w'&&w>0){
    if(allHit&&incFor(entry.ex)>0){var inc=incFor(entry.ex),nw=w+inc;if(isLb()){nw=Math.round((toU(w)+(inc>=5?10:5))/5)*5*LB;if(nw<=w)nw=w+5*LB}return {w:nw,r:low||top,text:'Try '+dW(nw)+' '+UL()+' × '+(low||top)}}
    var r=Math.min(...ws.map(function(s){return num(s.r)}));
    return {w:w,r:r+1,text:'Aim for '+dW(w)+' '+UL()+' × '+(r+1)};
  }
  if(e.type==='b'){var rr=Math.min(...ws.map(function(s){return num(s.r)}));return {w:w||'',r:rr+1,text:'Aim for '+(rr+1)+' reps'+(w?' (+'+dW(w)+' '+UL()+')':'')}}
  return null;
}
function phFor(entry,i){
  var pv=prevEntry(entry.ex,S.active&&S.active.start),ws=pv?working(pv.entry):[];
  var s=entry.sets[i];
  var wi=entry.sets.slice(0,i).filter(function(x){return x.t!=='w'}).length;
  var p=s.t==='w'?null:ws[Math.min(wi,ws.length-1)];
  if(p)return {w:p.w,r:p.r};
  var prior=entry.sets[i-1];
  if(prior&&(prior.w||prior.r))return {w:prior.w,r:prior.r};
  return {w:'',r:entry.type==='t'?(entry.reps||''):String(lowRep(entry.reps)||'')};
}
function prevText(entry,i){
  var pv=prevEntry(entry.ex,S.active&&S.active.start);if(!pv)return '';
  var ws=working(pv.entry);var s=entry.sets[i];if(s.t==='w')return '';
  var wi=entry.sets.slice(0,i).filter(function(x){return x.t!=='w'}).length;
  var p=ws[wi];if(!p)return '';
  var t=EX[entry.ex]?EX[entry.ex].type:'w';
  if(t==='t')return p.r+'s';

  se.entries.forEach(function(e){working(e).forEach(function(s){sets++;if(num(s.w)>0)vol+=num(s.w)*num(s.r);if(s.pr)prs++})});
  return {sets:sets,vol:vol,prs:prs,ms:(se.end||0)-(se.start||0)};
}
function checkPR(entry,idx){
  var s=entry.sets[idx];if(s.t==='w')return false;
  var t=EX[entry.ex]?EX[entry.ex].type:'w';
  var b=bestOf(entry.ex);
  var hist=b.e1>0;
  var v=t==='t'?num(s.r):(num(s.w)>0?e1rm(s.w,s.r):num(s.r));
  if(!hist||v<=0)return false;
  var inSession=0;
  entry.sets.forEach(function(o,k){if(k!==idx&&o.d&&o.t!=='w'&&o.pr!==undefined){var ov=t==='t'?num(o.r):(num(o.w)>0?e1rm(o.w,o.r):num(o.r));if(ov>inSession)inSession=ov}});
  return v>b.e1&&v>inSession;

var HARD=['deadlift','front_squat','dips','hang_leg','pullup','incline_bb','nordic','bulgarian','stepup'],NEVER=['wpullup','wall_lat','max_jump'];
function buildDefaults(){var p=S.settings.profile||{};return {goal:p.goal||'muscle',exp:p.exp||'beginner',days:p.days||3,mins:p.mins||60,where:p.where||'gym',shuffle:0}}
function genPlan(o){
  var kitv=kit(o.where),days=+o.days,n={30:4,45:5,60:6,75:7}[+o.mins]||6;
  var plan;
  if(days===2)plan=[['Full body A',T_FB_A],['Full body B',T_FB_B]];
  else if(days===3)plan=(o.exp==='beginner'||o.goal==='general'||o.goal==='fatloss')?[['Full body A',T_FB_A],['Full body B',T_FB_B],['Full body C',T_FB_C]]:[['Push',T_PUSH],['Pull',T_PULL],['Legs',T_LEGS]];
  else if(days===4)plan=[['Upper A',T_UP],['Lower A',T_LOW],['Upper B',T_UP],['Lower B',T_LOW]];
  else if(days===5)plan=[['Push',T_PUSH],['Pull',T_PULL],['Legs',T_LEGS],['Upper',T_UP],['Lower',T_LOW]];
  else plan=[['Push A',T_PUSH],['Pull A',T_PULL],['Legs A',T_LEGS],['Push B',T_PUSH],['Pull B',T_PULL],['Legs B',T_LEGS]];
  var used={},sets0={beginner:3,intermediate:4,advanced:5}[o.exp]||3,setsA={beginner:3,intermediate:3,advanced:4}[o.exp]||3;
  var repsMain={strength:'5',muscle:'8',fatloss:'12',general:'10'}[o.goal],repsAcc={strength:'8',muscle:'12',fatloss:'15',general:'12'}[o.goal];
  var restMain={strength:150,muscle:120,fatloss:60,general:90}[o.goal],restAcc={strength:90,muscle:75,fatloss:45,general:60}[o.goal];
  if(o.goal==='strength'&&o.exp==='beginner')sets0=3;
  return plan.map(function(d,di){
    var items=[];
    d[1].slice(0,n).forEach(function(mus,si){
      var avail=EXLIST.filter(function(e){return e.muscle===mus&&!e.custom&&NEVER.indexOf(e.id)<0&&e.eq.every(function(q){return kitv[q]})});
      var easy=o.exp==='beginner'?avail.filter(function(e){return HARD.indexOf(e.id)<0}):avail;
      if(easy.length)avail=easy;
      var fresh=avail.filter(function(e){return !used[e.id]});
      var pool=fresh.length?fresh:avail;if(!pool.length)return;
      var e=pool[(o.shuffle||0)%pool.length];used[e.id]=1;
      var main=si===0;
      if(e.type==='t')items.push({ex:e.id,sets:3,reps:'30',rest:45,note:''});
      else items.push({ex:e.id,sets:main?sets0:setsA,reps:main?repsMain:repsAcc,rest:main?restMain:restAcc,note:''});
    });
    if(o.goal==='fatloss'){var c=['treadmill','bike','rower','jog'].filter(function(id){return EX[id]&&EX[id].eq.every(function(q){return kitv[q]})})[0];if(c)items.push({ex:c,sets:1,reps:'600',rest:0,note:'Steady pace'})}
    return {name:d[0],items:items};
  });
}
function saveBuilt(o){
  var plan=genPlan(o);
  S.routines=S.routines.filter(function(r){return r.tag!=='Built for you'});
  var ids=[];
  plan.forEach(function(d){var r={id:uid(),name:d.name,tag:'Built for you',items:d.items};S.routines.push(r);ids.push(r.id)});
  S.plan={};(WEEKDAYS[+o.days]||[]).forEach(function(wd,i){if(ids[i])S.plan[wd]=ids[i]});
  S.settings.weekGoal=+o.days;S.settings.profile=Object.assign(S.settings.profile||{},{goal:o.goal,exp:o.exp,days:+o.days,mins:+o.mins,where:o.where});
  save();return plan.length;
}

function planPreviewHtml(o){

/* ---------- photos (IndexedDB, this device only) ---------- */
var idb=null;
function openDB(){
  return new Promise(function(res,rej){
    if(idb)return res(idb);
    var rq=indexedDB.open('gym-photos',1);
    rq.onupgradeneeded=function(){rq.result.createObjectStore('p',{keyPath:'id'})};
    rq.onsuccess=function(){idb=rq.result;res(idb)};rq.onerror=function(){rej(rq.error)};
  });
}
function dbAll(){return openDB().then(function(d){return new Promise(function(res,rej){var r=d.transaction('p').objectStore('p').getAll();r.onsuccess=function(){res(r.result||[])};r.onerror=function(){rej(r.error)}})}).catch(function(){return []})}
function dbPut(o){return openDB().then(function(d){return new Promise(function(res,rej){var t=d.transaction('p','readwrite');t.objectStore('p').put(o);t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
function dbDel(id){return openDB().then(function(d){return new Promise(function(res){var t=d.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=res})})}
function shrink(file,max){
  return new Promise(function(res,rej){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){var sc=Math.min(1,max/Math.max(img.width,img.height));var c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/jpeg',0.82)};
    img.onerror=function(){rej(new Error('img'))};img.src=u;
  });
}

/* ---------- charts (inline SVG, tokens only) ---------- */
function barChart(vals,labels,unit){
  var W=340,H=150,pl=30,pb=18,pt=14,n=vals.length,mx=Math.max.apply(null,vals.concat([1]));
  var bw=(W-pl)/n,g='';
  [0,0.5,1].forEach(function(f){var y=pt+(H-pt-pb)*(1-f);g+='<line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/><text x="'+(pl-4)+'" y="'+(y+3)+'" text-anchor="end">'+(f?fmtK(mx*f):0)+'</text>'});
  vals.forEach(function(v,i){var h=(H-pt-pb)*v/mx,x=pl+i*bw+bw*0.18,w=bw*0.64;
    g+='<rect x="'+x+'" y="'+(H-pb-h)+'" width="'+w+'" height="'+Math.max(h,v?1.5:0)+'" rx="3" fill="var(--accent)"/>';
    if(v&&(i===n-1||v===mx))g+='<text x="'+(x+w/2)+'" y="'+(H-pb-h-3)+'" text-anchor="middle" style="fill:var(--text)">'+fmtK(v)+'</text>';
    if(i%Math.ceil(n/4)===0&&i<n-1||i===n-1&&n<5)g+='<text x="'+(x+w/2)+'" y="'+(H-4)+'" text-anchor="middle">'+esc(labels[i])+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bar chart'+(unit?' in '+unit:'')+'">'+g+'</svg>';
}
function fmtK(v){return v>=10000?Math.round(v/1000)+'k':v>=1000?(Math.round(v/100)/10)+'k':fmt(v)}
function lineChart(pts,opts){
  opts=opts||{};
  if(!pts.length)return '<div class="empty">No data yet.</div>';
  var W=340,H=170,pl=36,pr=10,pt=12,pb=20;
  var xs=pts.map(function(p){return p.x}),ys=pts.map(function(p){return p.y});
  if(opts.goal)ys=ys.concat([opts.goal]);
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  if(x1===x0){x0-=86400000;x1+=86400000}
  var padY=(y1-y0)*0.15||1;y0-=padY;y1+=padY;
  function X(v){return pl+(W-pl-pr)*(v-x0)/(x1-x0)}
  function Y(v){return pt+(H-pt-pb)*(1-(v-y0)/(y1-y0))}
  var g='';
  [0,0.5,1].forEach(function(f){var v=y0+(y1-y0)*f,y=Y(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--border)"/><text x="'+(pl-4)+'" y="'+(y+3)+'" text-anchor="end">'+fmt(Math.round(v*10)/10)+'</text>'});
  if(opts.goal)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(opts.goal)+'" y2="'+Y(opts.goal)+'" stroke="var(--good)" stroke-dasharray="4 4"/><text x="'+(W-pr)+'" y="'+(Y(opts.goal)-3)+'" text-anchor="end" style="fill:var(--good)">goal '+fmt(opts.goal)+'</text>';
  if(opts.trend&&opts.trend.length>1)g+='<polyline fill="none" stroke="var(--accent2)" stroke-width="2.2" stroke-linejoin="round" points="'+opts.trend.map(function(p){return X(p.x)+','+Y(p.y)}).join(' ')+'"/>';
  g+='<polyline fill="none" stroke="var(--accent)" stroke-width="'+(opts.trend?1.2:2.2)+'" stroke-linejoin="round" '+(opts.trend?'opacity=".55" ':'')+'points="'+pts.map(function(p){return X(p.x)+','+Y(p.y)}).join(' ')+'"/>';
  pts.forEach(function(p,i){g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="'+(pts.length>40?1.8:3)+'" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.6"/>'});
  var last=pts[pts.length-1];g+='<text x="'+Math.min(X(last.x),W-pr-8)+'" y="'+(Y(last.y)-7)+'" text-anchor="end" style="fill:var(--text)">'+fmt(Math.round(last.y*10)/10)+'</text>';
  var a=new Date(x0),b=new Date(x1);
  g+='<text x="'+pl+'" y="'+(H-5)+'">'+a.getDate()+' '+MON[a.getMonth()]+'</text><text x="'+(W-pr)+'" y="'+(H-5)+'" text-anchor="end">'+b.getDate()+' '+MON[b.getMonth()]+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Line chart">'+g+'</svg>';
}
function hbars(rows){

}

  return list.map(function(p,i){var a=p.x-6*864e5,s=0,n=0;list.forEach(function(q){if(q.x<=p.x&&q.x>=a){s+=q.y;n++}});return {x:p.x,y:Math.round(s/n*10)/10}});
}

var STOP={barbell:1,dumbbell:1,cable:1,machine:1,smith:1,the:1,with:1,and:1,of:1,a:1};
var ALIAS={'bench press barbell':'bench','bench press dumbbell':'db_bench','squat barbell':'squat','back squat':'squat','deadlift barbell':'deadlift','overhead press barbell':'ohp','shoulder press dumbbell':'db_press','military press':'ohp','pull up':'pullup','pull ups':'pullup','chin up':'pullup','lat pulldown':'lat_pull','lat pulldown cable':'lat_pull','seated row':'cable_row','seated cable row':'cable_row','bent over row barbell':'bb_row','bicep curl dumbbell':'db_curl','bicep curl barbell':'bb_curl','curl':'bb_curl','triceps pushdown':'pushdown','tricep pushdown':'pushdown','triceps pushdown cable':'pushdown','romanian deadlift barbell':'rdl','romanian deadlift':'rdl','hip thrust barbell':'hip_thrust','leg press':'leg_press','leg extension machine':'leg_press','lateral raise dumbbell':'lat_raise','push up':'pushup','push ups':'pushup','dip':'dips','dips':'dips','plank':'plank','face pull':'face_pull','incline bench press dumbbell':'incline_db','incline bench press barbell':'incline_bb','incline dumbbell press':'incline_db','front squat':'front_squat','lunge':'bw_lunge','walking lunge':'walking_lunge','hammer curl dumbbell':'hammer','calf raise':'calf_machine','standing calf raise':'calf_machine','seated leg curl':'leg_curl','lying leg curl':'leg_curl','leg curl':'leg_curl','crunch':'crunch','hanging leg raise':'hang_leg','cable fly':'cable_fly','chest fly':'pec_deck','pec deck':'pec_deck'};
function normName(s){return String(s).toLowerCase().replace(/\(([^)]*)\)/g,' $1 ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function toks(s){return normName(s).split(' ').filter(function(w){return w&&!STOP[w]}).map(function(w){return w.replace(/s$/,'')})}
function matchEx(name){
  var n=normName(name);if(ALIAS[n])return {id:ALIAS[n],sure:true};
  var i,e;for(i=0;i<EXLIST.length;i++){e=EXLIST[i];if(normName(e.name)===n)return {id:e.id,sure:true}}
  var t=toks(name);if(!t.length)return {id:null};
  var best=null,bs=0;
  EXLIST.forEach(function(e){var u=toks(e.name),inter=t.filter(function(w){return u.indexOf(w)>=0}).length,uni=t.length+u.length-inter,sc=uni?inter/uni:0;if(sc>bs){bs=sc;best=e.id}});
  return bs>=0.6?{id:best,sure:false}:{id:null};
}
function parseCSV(text){
  var first=text.split(/\r?\n/)[0],d=(first.split(';').length>first.split(',').length)?';':',';
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===d){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.length>1||row[0])rows.push(row);row=[]}
    else cur+=c}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function toDate(s){var m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];var d=new Date(s);return isNaN(d)?null:ymd(d)}
function parseHistory(text,unit){
  var rows=parseCSV(text);if(rows.length<2)return null;
  var hd=rows[0].map(function(h){return h.trim().toLowerCase()});
  function col(names){for(var i=0;i<names.length;i++){var k=hd.indexOf(names[i]);if(k>=0)return k}return -1}
  var cEx=col(['exercise_title','exercise name','exercise']),cDate=col(['start_time','date','workout date']),cTitle=col(['title','workout name','workout']),cW=col(['weight_kg','weight','weight (kg)','weight_lbs']),cR=col(['reps']),cSec=col(['duration_seconds','seconds']),cType=col(['set_type']),cRpe=col(['rpe']);
  if(cEx<0||cDate<0)return null;
  var lb=unit==='lb'||(hd.indexOf('weight_lbs')>=0);
  var groups={},order=[];
  rows.slice(1).forEach(function(r){
    var ex=(r[cEx]||'').trim();if(!ex)return;var dt=toDate(r[cDate]);if(!dt)return;
    var title=cTitle>=0?(r[cTitle]||'Workout'):'Workout',key=dt+'|'+title+(cDate>=0?String(r[cDate]).slice(10,16):'');
    if(!groups[key]){groups[key]={date:dt,name:title,start:new Date(dt+'T12:00:00').getTime(),entries:{},eo:[]};order.push(key)}
    var g=groups[key];if(!g.entries[ex]){g.entries[ex]=[];g.eo.push(ex)}
    var w=cW>=0?num(r[cW]):0;if(lb)w=Math.round(w*0.45359*2)/2;
    var secs=cSec>=0?num(r[cSec]):0,rep=cR>=0?num(r[cR]):0,wu=cType>=0&&/warm/i.test(r[cType]||'');
    g.entries[ex].push({w:w?String(w):'',r:String(rep||secs||''),rpe:cRpe>=0&&r[cRpe]?String(num(r[cRpe])):'',d:true,t:wu?'w':'n'});
  });
  var names={};order.forEach(function(k){groups[k].eo.forEach(function(n){names[n]=(names[n]||0)+1})});
  var map={};Object.keys(names).forEach(function(n){map[n]=matchEx(n)});
  return {kind:'history',groups:order.map(function(k){return groups[k]}),names:names,map:map};
}
function toKg(v,u){return u&&/lb/i.test(u)?Math.round(v*0.45359*2)/2:v}
function parseRoutineText(text,unit){
  var lines=text.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean);
  var items=[],name='Imported routine',cur=null,named=false;
  var P1=/^(.*?)[\s:,\-–—]*?(\d+)\s*(?:x|×|sets?\s*(?:of|x)?)\s*(\d+(?:\s*-\s*\d+)?)(?:\s*reps?)?(?:\s*(?:@|at|with|-)?\s*(\d+(?:\.\d+)?)\s*(kg|lbs?|lb)?)?\s*$/i;
  var P2=/^\W*(?:\d+\s*[.:)\-]?\s+)?(\d+(?:\.\d+)?)\s*(kg|lbs?|lb)?\s*(?:x|×)\s*(\d+)(?:\s*reps?)?\s*$/i;
  var P3=/^(.*?)[\s:,\-–—]+(\d+)\s*(?:sec|secs|s|seconds)\b/i;
  lines.forEach(function(l0){
    var m2s=cur&&l0.match(P2);
    if(m2s){var wk0=toKg(num(m2s[1]),m2s[2]||unit);cur.sets=(cur._n=(cur._n||0)+1);cur.reps=m2s[3];cur._w=Math.max(cur._w||0,wk0);if(cur._w)cur.note='Top set: '+fmt(cur._w)+' kg';return}
    var l=l0.replace(/^[\s\-•*\d.)]+(?=[A-Za-z])/,'');
    var m=l.match(P1),m3=!m&&l.match(P3),m2=null;
    if(m&&m[1].trim()&&+m[2]<=20){var w=m[4]?toKg(num(m[4]),m[5]||unit):0;cur={raw:m[1].trim(),sets:+m[2],reps:m[3].replace(/\s/g,''),rest:0,note:w?'Last: '+fmt(w)+' kg':''};items.push(cur);return}
    if(m3&&m3[1].trim()){cur={raw:m3[1].trim(),sets:1,reps:m3[2],rest:0,note:''};items.push(cur);return}
    if(m2&&cur){var wk=toKg(num(m2[1]),m2[2]||unit);cur.sets=(cur._n=(cur._n||0)+1);cur.reps=m2[3];cur._w=Math.max(cur._w||0,wk);if(cur._w)cur.note='Top set: '+fmt(cur._w)+' kg';return}
    if(/\d/.test(l)&&!cur&&!named){name=l;named=true;return}
    if(!/\d/.test(l)||/^\w[\w\s'()\/&-]{2,}$/.test(l)){
      if(!named&&!items.length&&lines.indexOf(l)===0&&lines.length>1){name=l;named=true;return}
      cur={raw:l,sets:3,reps:'10',rest:0,note:'',_n:0};items.push(cur)}
  });
  items.forEach(function(i){var m=matchEx(i.raw.replace(/\s*\(?(?:barbell|dumbbell|cable|machine)\)?\s*$/i,function(x){return ' '+x.trim()}));i.ex=m.id;i.sure=!!m.sure;delete i._n;delete i._w});

}
function parseAny(text,unit){
  var t=text.trim();if(!t)return null;
  if(t.charAt(0)==='{'){try{var j=JSON.parse(t);if(j&&j.v&&j.routines)return {kind:'backup',data:j}}catch(e){}}

  if(/exercise/.test(first)&&(first.indexOf(',')>=0||first.indexOf(';')>=0)){var h=parseHistory(t,unit);if(h)return h}
  return parseRoutineText(t,unit);
}

function platesSheet(i){
  var e=S.active.entries[i],cur=toU(num((e.sets.filter(function(s){return s.t!=='w'&&s.w})[0]||{}).w)||60);

function finishWorkout(){
  var a=S.active;
  var entries=a.entries.map(function(e){return Object.assign({},e,{sets:e.sets.filter(function(s){return s.d})})}).filter(function(e){return e.sets.length});
  if(!entries.length){sheet('<h2>No sets logged</h2><p class="dim">Tick at least one set to save a workout.</p><div class="row"><button class="btn crit sp" data-act="discard">Discard it</button><button class="btn ghost sp" data-act="closesheet">Keep going</button></div>');return}
  var se={id:a.id,rid:a.rid,name:a.name,mode:a.mode,date:a.date,start:a.start,end:Date.now(),entries:entries};
  S.sessions.push(se);if(a.rid)S.lastDone[a.rid]=a.date;
  S.active=null;save();
  var st=sessionStats(se),prl=[];
  entries.forEach(function(e){e.sets.forEach(function(s){if(s.pr)prl.push(exName(e.ex)+': '+(num(s.w)>0?dW(s.w)+' '+UL()+' × '+s.r:s.r+(EX[e.ex]&&EX[e.ex].type==='t'?'s':' reps')))})});

}

function csvCell(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(){
  var rows=[['Date','Workout','Place','Exercise','Set','Type','Weight (kg)'].concat(isLb()?['Weight (lb)']:[],['Reps or seconds','RPE','PR'])];
  S.sessions.slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date))}).forEach(function(se){
    se.entries.forEach(function(en){var n=0;en.sets.forEach(function(s){if(!s.d)return;n++;
      rows.push([se.date,se.name,se.mode||'gym',exName(en.ex),n,s.t==='w'?'warm-up':'working',s.w===''||s.w==null?'':fmt(num(s.w))].concat(isLb()?[s.w===''||s.w==null?'':dW(s.w)]:[],[s.r,s.rpe||'',s.pr?'yes':'']))})})});
  if(rows.length<2){toast('Nothing to export yet');return}
  var txt=rows.map(function(r){return r.map(csvCell).join(',')}).join('\n');

  catch(e){copyText(txt,'CSV copied')}
}

function copyText(t,msg){

/* ---------- click handling ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,i=el.dataset.i!==undefined?+el.dataset.i:null,s=el.dataset.s!==undefined?+el.dataset.s:null;
  var act=S.active;
  if(el.tagName==='INPUT'&&el.type==='file')return;
  switch(a){
  case 'mode':setMode(el.dataset.m);break;
  case 'tab':go(el.dataset.t);break;
  case 'goto':go(el.dataset.t);break;
  case 'back':back();break;
  case 'rview':{var rr=rById(el.dataset.r);if(!rr)break;var nsets=rr.items.reduce(function(a,i){return a+i.sets},0);

  case 'theme':S.settings.theme=el.dataset.t;save();applyTheme();render();break;
  case 'accent':S.settings.accent=el.dataset.c||'';save();applyTheme();render();break;
  case 'build':ui.build=buildDefaults();go('work',{k:'builder'});break;
  case 'bset':ui.build=ui.build||buildDefaults();ui.build[el.dataset.k]=(el.dataset.k==='days'||el.dataset.k==='mins')?+el.dataset.v:el.dataset.v;ui.build.shuffle=0;render();break;
  case 'bshuffle':ui.build.shuffle=(ui.build.shuffle||0)+1;render();break;
  case 'bsave':{var nb=saveBuilt(ui.build);toast('Saved '+nb+' routines and set your week');go('work');break}
  case 'su':{var pp=suProfile();pp[el.dataset.k]=(el.dataset.k==='days'||el.dataset.k==='mins')?+el.dataset.v:el.dataset.v;if(el.dataset.k==='where')S.mode=el.dataset.v;save();render();break}
  case 'sunext':ui.setup.step=Math.min(ui.setup.step+1,SU_STEPS.length-1);render();break;
  case 'suback':ui.setup.step=Math.max(ui.setup.step-1,0);render();break;
  case 'sufinish':{var pf=suProfile();S.settings.setupDone=true;if(el.dataset.build==='1'){S.mode=pf.where;saveBuilt(Object.assign(buildDefaults(),pf,{shuffle:0}))}save();nav={tab:'today',sub:null};render();break}
  case 'resetup':S.settings.setupDone=false;ui.setup={step:0};save();render();break;
  case 'settings':go(nav.tab,{k:'settings'});break;
  case 'closesheet':closeSheet();break;
  case 'start':
    closeSheet();
    if(S.active){toast('Finish or discard your current workout first');openWorkout();break}
    startRoutine(el.dataset.r,S.mode);openWorkout();break;
  case 'empty':if(S.active){openWorkout();break}startEmpty();openWorkout();break;
  case 'resume':openWorkout();break;
  case 'minimize':nav.sub=null;render();window.scrollTo(0,0);break;
  case 'tick':{
    var e=act.entries[i],st=e.sets[s],t=EX[e.ex]?EX[e.ex].type:e.type;
    if(!st.d){
      var ph=phFor(e,s),h=hintFor(e);
      if(st.w===''&&t!=='t'){var pw=ph.w!==''?ph.w:(h&&h.w!==''?h.w:'');if(pw!=='')st.w=String(pw)}
      if(st.r===''){var pr=ph.r!==''?ph.r:(h?h.r:'');if(pr!=='')st.r=String(pr)}
      if(st.r===''&&!(t==='w'&&num(st.w)>0)){toast('Enter reps first');break}
      st.d=true;
      if(checkPR(e,s)){st.pr=true;toast('New PR on '+exName(e.ex)+'!',3200)}else delete st.pr;
      if(e.rest&&st.t!=='w'||(e.rest&&s<e.sets.length-1)){startRest(st.t==='w'?Math.min(e.rest,60):e.rest)}
    }else{st.d=false;delete st.pr}
    save();ui.keepScroll=true;render();break}
  case 'addset':{var e1=act.entries[i],l=e1.sets[e1.sets.length-1]||{};e1.sets.push({w:l.w||'',r:l.r||'',rpe:'',d:false,t:'n'});save();ui.keepScroll=true;render();break}
  case 'rmset':{act.entries[i].sets.pop();save();ui.keepScroll=true;render();break}
  case 'settype':{var x=act.entries[i].sets[s];x.t=x.t==='w'?'n':'w';save();ui.keepScroll=true;render();break}
  case 'usehint':{var e2=act.entries[i],h2=hintFor(e2);if(h2){e2.sets.forEach(function(q){if(!q.d&&q.t!=='w'){q.w=h2.w===''?'':String(h2.w);q.r=String(h2.r)}});save();ui.keepScroll=true;render()}break}

  case 'savenote':act.entries[i].note=$('#exn').value.trim();save();closeSheet();ui.keepScroll=true;render();break;

  case 'setrest':act.entries[i].rest=+el.dataset.v;save();closeSheet();ui.keepScroll=true;render();break;
  case 'exup':if(i>0){var q=act.entries;var t1=q[i];q[i]=q[i-1];q[i-1]=t1;save();closeSheet();ui.keepScroll=true;render()}break;
  case 'exdn':if(i<act.entries.length-1){var q2=act.entries;var t2=q2[i];q2[i]=q2[i+1];q2[i+1]=t2;save();closeSheet();ui.keepScroll=true;render()}break;
  case 'exrm':act.entries.splice(i,1);save();closeSheet();ui.keepScroll=true;render();break;

  case 'pickok':{var cb=pickCb;closeSheet();pickCb=null;if(cb)cb(el.dataset.id);break}
  case 'finish':finishWorkout();break;
  case 'discard':sheet('<h2>Discard this workout?</h2><p class="dim">Everything logged in it is lost.</p><div class="row"><button class="btn ghost sp" data-act="closesheet">Keep it</button><button class="btn crit sp" data-act="discardok">Discard</button></div>');break;
  case 'discardok':S.active=null;save();closeSheet();nav={tab:'today',sub:null};render();break;

  case 'restskip':if(act){act.rest=null;save();$('#restslot').innerHTML=''}break;
  /* routines */
  case 'newroutine':{var r={id:uid(),name:'New routine',tag:'My routines',items:[]};S.routines.push(r);save();go('work',{k:'routine',id:r.id});break}
  case 'rmenu':{var rid=el.dataset.r;sheet('<h2>'+esc(rById(rid).name)+'</h2><ul class="list">'+[['redit','Edit'],['rdup','Duplicate'],['rcopy','Copy as text (to share)'],['rdel','Delete']].map(function(x){return '<li data-act="'+x[0]+'" data-r="'+rid+'" style="cursor:pointer"><b'+(x[0]==='rdel'?' style="color:var(--crit)"':'')+'>'+x[1]+'</b></li>'}).join('')+'</ul>');break}
  case 'redit':closeSheet();go('work',{k:'routine',id:el.dataset.r});break;
  case 'rdup':{var o=rById(el.dataset.r),c=clone(o);c.id=uid();c.name=o.name+' copy';S.routines.push(c);save();closeSheet();render();toast('Duplicated');break}
  case 'rcopy':copyText(routineText(rById(el.dataset.r)),'Copied. Paste it anywhere, or import it on another device');closeSheet();break;
  case 'rdel':sheet('<h2>Delete this routine?</h2><div class="row"><button class="btn ghost sp" data-act="closesheet">Cancel</button><button class="btn crit sp" data-act="rdelok" data-r="'+el.dataset.r+'">Delete</button></div>');break;
  case 'rdelok':S.routines=S.routines.filter(function(r2){return r2.id!==el.dataset.r});save();closeSheet();render();break;
  case 'ritemadd':pickSheet('Add to routine',function(id){var r3=rById(nav.sub.id),x3=EX[id];r3.items.push({ex:id,sets:3,reps:x3.type==='t'?'30':'10',rest:0,note:''});save();ui.keepScroll=true;render()});break;
  case 'ritemrm':{var r4=rById(nav.sub.id);r4.items.splice(i,1);save();ui.keepScroll=true;render();break}
  case 'ritemup':{var r5=rById(nav.sub.id);if(i>0){var tt=r5.items[i];r5.items[i]=r5.items[i-1];r5.items[i-1]=tt;save();ui.keepScroll=true;render()}break}
  case 'ritemdn':{var r6=rById(nav.sub.id);if(i<r6.items.length-1){var t3=r6.items[i];r6.items[i]=r6.items[i+1];r6.items[i+1]=t3;save();ui.keepScroll=true;render()}break}
  case 'planweek':{var order=[1,2,3,4,5,6,0];sheet('<h2>Weekly plan</h2><p class="sm dim" style="margin:0 0 8px">What Today suggests each day. Leave blank for rest days.</p>'+order.map(function(d){return '<div class="row" style="margin:6px 0"><b style="width:44px">'+DOW[d]+'</b><select data-plan="'+d+'"><option value="">Rest</option>'+S.routines.map(function(r7){return '<option value="'+r7.id+'"'+(S.plan[d]===r7.id?' selected':'')+'>'+esc(r7.name)+'</option>'}).join('')+'</select></div>'}).join('')+'<div class="row" style="margin-top:12px"><button class="btn sp" data-act="closesheet">Done</button></div>');break}
  case 'import':ui.imp=null;go('work',{k:'import'});break;
  /* exercises */
  case 'exm':ui.exm=el.dataset.m;render();break;
  case 'exavail':ui.exavail=el.checked;$('#exlist').innerHTML=exListHtml();break;
  case 'exopen':exDetail(el.dataset.id);break;
  case 'newex':newExSheet();break;
  case 'cxeq':el.classList.toggle('on');break;
  case 'savecx':{var nm=$('#cx-name').value.trim();if(!nm){toast('Give it a name');break}var eq=$$('#cx-eq .chip.on').map(function(c){return c.dataset.q});addCustomEx(nm,$('#cx-m').value,$('#cx-t').value,eq);save();closeSheet();render();toast('Added');break}
  case 'delex':S.customEx=S.customEx.filter(function(c){return c.id!==el.dataset.id});delete EX[el.dataset.id];EXLIST.splice(EXLIST.findIndex(function(x){return x.id===el.dataset.id}),1);save();closeSheet();render();break;
  /* progress + body */
  case 'progtab':ui.prog=el.dataset.t;render();break;
  case 'bodytab':ui.body=el.dataset.t;ui.sel=[];render();break;
  case 'addweight':{var v=fromU($('#bw-in').value);if(v<20||v>400){toast('Enter your weight in '+UL());break}v=Math.round(v*100)/100;var d0=today();S.weights=S.weights.filter(function(w){return w.d!==d0});S.weights.push({d:d0,kg:v});save();render();toast('Logged');break}
  case 'delweight':S.weights=S.weights.filter(function(w){return w.d!==el.dataset.d});save();render();break;
  case 'addmeasure':{var vv={},any=false;['chest','waist','hips','arm','thigh','neck'].forEach(function(k){var x4=num($('#ms-'+k).value);if(x4){vv[k]=x4;any=true}});if(!any){toast('Enter at least one');break}var d1=today();S.measures=S.measures.filter(function(m){return m.d!==d1});S.measures.push({d:d1,v:vv});save();render();toast('Saved');break}
  case 'delmeasure':S.measures=S.measures.filter(function(m){return m.d!==el.dataset.d});save();render();break;
  case 'photosel':{var id=el.dataset.id,k=ui.sel.indexOf(id);if(k>=0)ui.sel.splice(k,1);else{if(ui.sel.length>=2)ui.sel.shift();ui.sel.push(id)}render();break}
  case 'compare':compareSheet();break;
  case 'delphotos':Promise.all(ui.sel.map(dbDel)).then(function(){ui.sel=[];closeSheet();render()});break;
  /* settings */
  case 'kit':{var kk=el.dataset.w==='Home'?S.settings.kitHome:S.settings.kitGym;kk[el.dataset.q]=!kk[el.dataset.q];save();render();break}
  case 'syncnow':sync.state='local';pull(function(){push()});break;
  case 'signin':doAuth(false);break;
  case 'signup':doAuth(true);break;
  case 'signout':authSet(null);sync.state='local';sync.msg='Saved on this device';render();break;
  case 'backup':copyText(JSON.stringify(S),'Backup copied');break;
  case 'unit':S.settings.unit=el.dataset.u==='lb'?'lb':'kg';save();render();break;
  case 'csvexport':exportCSV();break;
  case 'privacy':privacySheet();break;
  case 'dlbackup':{var b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(b),an=document.createElement('a');an.href=u;an.download='gym-backup-'+today()+'.json';document.body.appendChild(an);an.click();an.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000);break}
  case 'restorestarters':{var have={};S.routines.forEach(function(r8){have[r8.id]=1});var add=SEED.filter(function(r9){return !have[r9.id]});add.forEach(function(r10){S.routines.push(clone(r10))});save();toast(add.length?'Restored '+add.length+' routines':'All starters already there');break}
  case 'resetall':sheet('<h2>Delete all gym data?</h2><p class="dim">Workouts, routines, body logs and settings. This can\'t be undone.</p><div class="row"><button class="btn ghost sp" data-act="closesheet">Cancel</button><button class="btn crit sp" data-act="resetok">Delete everything</button></div>');break;
  case 'resetok':S=defaults();EXLIST=EXLIST.filter(function(e){return !e.custom});save();closeSheet();nav={tab:'today',sub:null};render();break;
  /* import */
  case 'impparse':{var tx=$('#imp-text').value,un=$('#imp-unit').value;var pr2=parseAny(tx,un);ui.imp={text:tx,unit:un,parsed:pr2};if(!pr2)toast('Nothing to read yet');render();break}
  case 'impback':ui.imp=ui.imp?{text:ui.imp.text,unit:ui.imp.unit}:null;render();break;
  case 'impdrop':ui.imp.parsed.items.splice(i,1);render();break;
  case 'improutine':{var p=ui.imp.parsed;if(!p.items.length)break;var items=p.items.map(function(it){var id=it.ex||addCustomEx(it.raw,'Other','w',[]);return {ex:id,sets:Math.max(1,+it.sets||1),reps:String(it.reps||'10'),rest:0,note:it.note||''}});var rr={id:uid(),name:p.name||'Imported routine',tag:'Imported',items:items};S.routines.push(rr);save();ui.imp=null;go('work',{k:'routine',id:rr.id});toast('Routine saved. Check it over.');break}
  case 'imphist':{var ph=ui.imp.parsed,mp={};$$('[data-impmap]').forEach(function(sl){mp[sl.dataset.impmap]=sl.value});var have2={};S.sessions.forEach(function(se){have2[se.date+'|'+se.name]=1});var addN=0,sk=0;
    ph.groups.forEach(function(g){var key=g.date+'|'+g.name;if(have2[key]){sk++;return}
      var ents=g.eo.map(function(n){var id=mp[n]||addCustomEx(n,'Other','w',[]);mp[n]=id;return {k:uid(),o:id,ex:id,type:EX[id].type,reps:'',rest:0,note:'',sets:g.entries[n]}});
      S.sessions.push({id:uid(),rid:null,name:g.name,mode:'gym',date:g.date,start:g.start,end:g.start+3600000,entries:ents,imported:true});addN++});
    save();ui.imp=null;go('prog');toast('Imported '+addN+' workouts'+(sk?', skipped '+sk+' already here':''),4000);break}
  case 'imprestore':{var j=ui.imp.parsed.data;S=Object.assign(defaults(),j);S.settings=Object.assign(defaults().settings,j.settings||{});registerCustom(S.customEx);S.active=null;save();ui.imp=null;nav={tab:'today',sub:null};render();toast('Backup restored');break}
  }
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.dataset.act==='photofile'&&el.files&&el.files[0]){
    shrink(el.files[0],1100).then(function(b){return dbPut({id:uid(),date:today(),blob:b})}).then(function(){toast('Photo saved on this device');loadPhotos()}).catch(function(){toast('Could not save that photo')});el.value='';return}
  if(el.dataset.act==='impfile'&&el.files&&el.files[0]){
    var fr=new FileReader();fr.onload=function(){var tx=String(fr.result),un=($('#imp-unit')||{}).value||'kg';var pr=parseAny(tx,un);ui.imp={text:tx,unit:un,parsed:pr};if(!pr)toast('Could not read that file');render()};fr.readAsText(el.files[0]);el.value='';return}
  if(el.dataset.plan!==undefined){S.plan[el.dataset.plan]=el.value;save();return}
  if(el.dataset.set){var k=el.dataset.set;if(el.type==='checkbox')S.settings[k]=el.checked;else S.settings[k]=Math.max(0,num(el.value));save();return}
  if(el.dataset.impex!==undefined){ui.imp.parsed.items[+el.dataset.impex].ex=el.value||null;render();return}
  if(el.dataset.impmap!==undefined){ui.imp.parsed.map[el.dataset.impmap]={id:el.value||null};return}
  if(el.dataset.q==='liftEx'){ui.liftEx=el.value;render();return}
});
document.addEventListener('input',function(ev){
  var el=ev.target;
  if(el.dataset.f&&el.dataset.i!==undefined&&el.dataset.s!==undefined&&S.active){S.active.entries[+el.dataset.i].sets[+el.dataset.s][el.dataset.f]=(el.dataset.f==='w'&&el.value!=='')?kgStr(el.value):el.value;save();return}
  if(el.dataset.ri!==undefined){var r=rById(nav.sub.id),it=r.items[+el.dataset.ri],f=el.dataset.f;it[f]=(f==='sets'||f==='rest')?Math.max(0,Math.round(num(el.value))):el.value;save();return}
  if(el.dataset.rf){rById(nav.sub.id)[el.dataset.rf]=el.value;save();return}
  if(el.dataset.q==='exq'){ui.exq=el.value;$('#exlist').innerHTML=exListHtml();return}
  if(el.dataset.q==='goalKg'){S.settings.goalKg=el.value===''?'':kgStr(el.value);save();return}
  if(el.dataset.impname!==undefined){ui.imp.parsed.name=el.value;return}
  if(el.dataset.impf){ui.imp.parsed.items[+el.dataset.i][el.dataset.impf]=el.value;return}
});
window.addEventListener('popstate',function(ev){
  var st=ev.state;closeSheet();
  if(st&&st.gym){nav={tab:st.tab,sub:st.sub}}else{nav={tab:'today',sub:null}}
  if(nav.sub&&nav.sub.k==='workout'&&!S.active)nav.sub=null;
  render();
});

/* ---------- boot ---------- */
try{history.replaceState({gym:1,tab:'today',sub:null},'')}catch(e){}
if(S.active&&Date.now()-S.active.start>1000*60*60*14){/* stale unfinished workout, keep but don't auto-open */}
applyTheme();
render();
pull(function(changed){if(changed)render()});
try{if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js')}catch(e){}

})();
</script>
</body>
</html>
